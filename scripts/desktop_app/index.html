<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AceChess Wiki - Cẩm Nang Cờ Vương Giả</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0e17;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Màn hình Offline khi mất mạng */
    .offline-container {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0e17;
      color: #f0f4fc;
      padding: 24px;
      text-align: center;
    }

    .offline-box {
      background: rgba(18, 26, 42, 0.95);
      border: 1px solid rgba(203, 180, 108, 0.4);
      border-radius: 14px;
      padding: 36px 40px;
      max-width: 480px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .offline-logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2px solid #e6c66b;
      margin-bottom: 16px;
    }

    .offline-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 10px;
    }

    .offline-desc {
      font-size: 13px;
      color: #8b9bb4;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .btn-retry {
      background: linear-gradient(135deg, #ffd700, #e6c66b);
      color: #0a0e17;
      border: none;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(255, 215, 0, 0.25);
    }

    .btn-retry:hover {
      box-shadow: 0 4px 16px rgba(255, 215, 0, 0.4);
    }
  </style>
</head>
<body>
  <iframe id="wiki-frame" src="https://covuonggia.vercel.app"></iframe>

  <div class="offline-container" id="offline-view">
    <div class="offline-box">
      <img src="favicon.png" alt="Logo" class="offline-logo">
      <h2 class="offline-title">Không có kết nối Internet</h2>
      <p class="offline-desc">
        Không thể tải Cẩm Nang trực tuyến. Vui lòng kiểm tra lại mạng Internet trên máy tính của bạn và thử lại.
      </p>
      <button class="btn-retry" onclick="retryConnection()">Thử Kết Nối Lại</button>
    </div>
  </div>

  <script>
    const PRIMARY_URL = 'https://covuonggia.vercel.app';
    const frame = document.getElementById('wiki-frame');
    const offlineView = document.getElementById('offline-view');

    frame.onerror = function() {
      frame.style.display = 'none';
      offlineView.style.display = 'flex';
    };

    function retryConnection() {
      offlineView.style.display = 'none';
      frame.style.display = 'block';
      frame.src = PRIMARY_URL + '?t=' + Date.now();
    }

    window.addEventListener('keydown', function(e) {
      if (e.key === 'F5' || (e.ctrlKey && e.key.toLowerCase() === 'r')) {
        e.preventDefault();
        retryConnection();
      }
    });
  </script>
</body>
</html>
